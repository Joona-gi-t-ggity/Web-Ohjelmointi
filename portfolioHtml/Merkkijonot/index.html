<!DOCTYPE html>
<html lang="fi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="icon" href="../../media/iconDrawing.png" type="image/png">
        <link rel="stylesheet" href="../../CSS/styles.css" id="styleSheetElem">

        <title>Merkkijonot</title>
        <script src="./scripts.js" defer></script>
    </head>
    <body>
        <header> 
            <h1> Merkkijonot </h1>
        </header>
        <hr>
        <div style="display: flex; margin-left: 0%;">
            <nav> <!-- Nav palkki -->
                <a href="../../subHtml/cv_sivu.html"> CV sivulle... </a>
                <a href="../../subHtml/tyokoke.html"> Tylkokemus sivulle... </a>
                <a href="../perusTeht/grid.html"> Portfolioon..? </a>
            </nav>
        </div>
        <hr>
        <main>
            <section>
                <h2>Poimi kirjain</h2>
                <input type="text" id="poimTextUin">
                <br>
                <input type="number" id="poimNumUin">
                <br>
                <button onclick="getNthChar('poimTextUin', 'poimNumUin', 'poimOutputBox')">Näytä</button>
                <br>
                <div id="poimOutputBox" style="
                        border: 0.1em solid #000000; 
                        margin: 0.5em; 
                        padding: 0.5em;
                        width: fit-content;">
                    Ei vielä mitään 
                </div>
            </section>
            <section>
                <h2>Löydä indeksi</h2>
                <input type="text" id="findexTextUin">
                <br>
                <input type="text" id="findexCharUin">
                <br>
                <button onclick="findIndexOfChar('findexTextUin', 'findexCharUin', 'findexOutputBox')">Näytä</button>
                <br>
                <div id="findexOutputBox" style="
                        border: 0.1em solid #000000; 
                        margin: 0.5em; 
                        padding: 0.5em;
                        width: fit-content;">
                    Ei vielä mitään 
                </div>
            </section>
            <section>
                <h2>Leikkaa merkkijono</h2>
                <input type="text" id="cutTextUin">
                <br>
                <input type="number" id="cutFNumUin">
                <br>
                <input type="number" id="cutSNumUin">
                <br>
                <button onclick="cutStr('cutTextUin', 'cutFNumUin', 'cutSNumUin', 'cutOutputBox')">Näytä</button>
                <br>
                <div id="cutOutputBox" style="
                        border: 0.1em solid #000000; 
                        margin: 0.5em; 
                        padding: 0.5em;
                        width: fit-content;">
                    Ei vielä mitään 
                </div>
            </section>
            <section>
                <h2>Poikki ja pinoon</h2>
                <input type="text" id="stackTextUin">
                <br>
                <input type="text" id="stackOnUin">
                <br>
                <button onclick="stackParts('stackTextUin', 'stackOnUin', 'stacOutputList')">Näytä</button>
                <br>
                <ul id="stacOutputList"></ul>
            </section>
        </main>
    </body>
</html>
