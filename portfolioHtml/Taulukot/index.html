<!DOCTYPE html>
<html lang="fi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="../../media/iconDrawing.png" type="image/png">
        <link rel="stylesheet" href="../../CSS/styles.css" id="styleSheetElem">

        <title>Taulukot</title>
        <script src="./scripts.js" defer></script>
    </head>
    <body>
        <header> 
            <h1> Taulukot </h1>
        </header>
        <hr>
        <div style="display: flex; margin-left: 0%;">
            <nav> <!-- Nav palkki -->
                <a href="../../subHtml/cv_sivu.html"> CV sivulle... </a>
                <a href="../../subHtml/tyokoke.html"> Tylkokemus sivulle... </a>
                <a href="../perusTeht/grid.html"> Portfolioon..? </a>
            </nav>
        </div>
        <hr>
        <main>
            <section>
                <h2> Poimi elementti </h2>
                <label for="listIndexUin">index: </label>
                <input type="number" id="listIndexUin" name="listIndexUin">
                <button onclick="pickElement('listIndexUin', 'pickOutputDiv')"> Näytä </button>
                <div id="pickOutputDiv"></div>
            </section>

            <section>
                <h2> Löydä indeksi </h2>
                <label for="searchWordUin">haku: </label>
                <input type="text" id="searchWordUin" name="searchWordUin">
                <button onclick="getIndex('searchWordUin', 'findOutputDiv')"> Näytä </button>
                <div id="findOutputDiv"></div>
            </section>

            <section>
                <h2> Leikkaa taulukko </h2>
                <label for="cut_num1Uin">Num 1: </label>
                <input type="number" id="cut_num1Uin" name="cut_num1Uin">
                <br>
                <label for="cut_num2Uin">Num 2: </label>
                <input type="number" id="cut_num2Uin" name="cut_num2Uin">
                <button onclick="cutList('cut_num1Uin', 'cut_num2Uin', 'cutOutput')"> Näytä </button>
                <ul id="cutOutput"></ul>
            </section>
            <section>
                <h2> Järjestä </h2>
                <button onclick="printTxt('sortOutput')"> Tulosta tekstit </button>
                <button onclick="printNum('sortOutput')"> Tulosta numerot </button>
                <br>
                <button onclick="sortTxt()"> Järjestä tekstit </button>
                <button onclick="sortNum()"> Järjestä numerot </button>
                <br>
                <button onclick="reverseTxt()"> Käännä tekstien järjestys </button>
                <button onclick="reverseNum()"> Käännä numeroiden järjestys </button>
                <br>
                <ul id="sortOutput"></ul>
            </section>
            <section>
                <h2>Suodata</h2>
                <label for="filterNumUin">num: </label>
                <input type="number" id="filterNumUin" name="filterNumUin">
                <button onclick="printNum('filterOutput')"> Tulosta numerot </button>
                <button onclick="filterOver('filterNumUin')"> Valitse suuremmat </button>
                <button onclick="filterUnder('filterNumUin')"> Valitse pienemmät </button>
                <ul id="filterOutput"></ul>
            </section>
        </main>
    </body>
</html>
